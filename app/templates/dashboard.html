<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RILVON | Lead Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
            min-height: 100vh;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        header span {
            color: #9ca3af;
            font-size: 14px;
        }

        main {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .top {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.08);

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .top h2 {
            margin-bottom: 8px;
        }

        .top p {
            color: #6b7280;
        }

        button {
            background: #111827;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #374151;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            border-radius: 16px;
            padding: 25px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .stat-title {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 30px;
            font-weight: bold;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin-bottom: 20px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 14px 12px;
            border-bottom: 1px solid #e5e7eb;
            vertical-align: top;
        }

        th {
            background: #f9fafb;
            font-size: 13px;
            color: #6b7280;
        }

        td {
            font-size: 14px;
        }

        .message {
            max-width: 350px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .error {
            margin-top: 15px;
            padding: 15px;
            background: #fef2f2;
            color: #991b1b;
            border-radius: 8px;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        @media (max-width: 800px) {

            header {
                padding: 20px;
            }

            .top {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            main {
                margin-top: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>RILVON</h1>
    <span>Lead Yönetim Paneli</span>
</header>

<main>

    <section class="top">
        <div>
            <h2>Lead Dashboard</h2>
            <p>
                RILVON web sitesinden gelen iletişim taleplerini görüntüleyin.
            </p>
        </div>

        <button onclick="leadleriGetir()">
            Yenile
        </button>
    </section>


    <section class="stats">

        <div class="stat">
            <div class="stat-title">
                Toplam Lead
            </div>

            <div
                class="stat-value"
                id="totalLeads"
            >
                -
            </div>
        </div>


        <div class="stat">
            <div class="stat-title">
                Son Lead
            </div>

            <div
                class="stat-value"
                id="lastLead"
            >
                -
            </div>
        </div>


        <div class="stat">
            <div class="stat-title">
                Sistem Durumu
            </div>

            <div
                class="stat-value"
                id="systemStatus"
            >
                Kontrol ediliyor...
            </div>
        </div>

    </section>


    <section class="card">

        <h3>📩 Gelen Leadler</h3>

        <div
            id="loading"
            class="loading"
        >
            Lead kayıtları yükleniyor...
        </div>

        <div
            id="error"
            class="error"
            style="display:none;"
        ></div>

        <div
            id="empty"
            class="empty"
            style="display:none;"
        >
            Henüz kayıtlı lead bulunmuyor.
        </div>

        <div
            id="tableContainer"
            class="table-wrapper"
            style="display:none;"
        >

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Ad Soyad</th>
                        <th>Telefon</th>
                        <th>Mesaj</th>
                        <th>Tarih</th>
                    </tr>
                </thead>

                <tbody id="leadTableBody"></tbody>

            </table>

        </div>

    </section>

</main>


<script>

async function leadleriGetir() {

    const loading =
        document.getElementById("loading");

    const error =
        document.getElementById("error");

    const empty =
        document.getElementById("empty");

    const tableContainer =
        document.getElementById("tableContainer");

    const tableBody =
        document.getElementById("leadTableBody");

    const totalLeads =
        document.getElementById("totalLeads");

    const lastLead =
        document.getElementById("lastLead");

    const systemStatus =
        document.getElementById("systemStatus");


    loading.style.display = "block";
    error.style.display = "none";
    empty.style.display = "none";
    tableContainer.style.display = "none";

    systemStatus.textContent = "Kontrol ediliyor...";


    try {

        const response = await fetch("/api/leads");

        const data = await response.json();


        if (!response.ok || !data.basari) {

            throw new Error(
                data.hata || "Lead kayıtları alınamadı."
            );

        }


        const leadler = data.leadler || [];


        totalLeads.textContent =
            leadler.length;


        if (leadler.length > 0) {

            lastLead.textContent =
                "#" + leadler[0].id;

        } else {

            lastLead.textContent = "-";

        }


        systemStatus.textContent = "Aktif";


        tableBody.innerHTML = "";


        if (leadler.length === 0) {

            empty.style.display = "block";

        } else {

            leadler.forEach(function(lead) {

                const row =
                    document.createElement("tr");


                row.innerHTML = `
                    <td>${lead.id ?? "-"}</td>

                    <td>${escapeHtml(
                        lead.isim ?? "-"
                    )}</td>

                    <td>${escapeHtml(
                        lead.telefon ?? "-"
                    )}</td>

                    <td class="message">${escapeHtml(
                        lead.mesaj ?? "-"
                    )}</td>

                    <td>${escapeHtml(
                        lead.tarih ?? "-"
                    )}</td>
                `;


                tableBody.appendChild(row);

            });


            tableContainer.style.display =
                "block";

        }

    } catch (err) {

        console.error(err);

        systemStatus.textContent =
            "Hata";

        error.textContent =
            err.message ||
            "Lead kayıtları alınırken bir hata oluştu.";

        error.style.display = "block";

    } finally {

        loading.style.display = "none";

    }
}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


document.addEventListener(
    "DOMContentLoaded",
    leadleriGetir
);

</script>

</body>
</html>
